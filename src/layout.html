<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Generated by scripts/build.mjs from src/. Edit the files in src/ and data/, then run the build. -->
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#0f766e">
  <meta name="geo.region" content="PK-PB">
  <meta name="geo.placename" content="Rohillanwali, Muzaffargarh">

  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{businessName}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
{{ogImageTags}}
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{root}}css/style.css">
{{pageStyles}}
{{jsonLd}}
</head>
<body data-root="{{root}}" class="{{bodyClass}}">
{{> icons}}
  <a class="skip-link" href="#main">Skip to content</a>
{{> header}}
  <main id="main">
{{content}}
  </main>
{{> footer}}
  <script src="{{root}}js/config.js" defer></script>
  <script src="{{root}}data/products.js" defer></script>
  <script src="{{root}}data/images.js" defer></script>
  <script src="{{root}}js/catalog.js" defer></script>
  <script src="{{root}}js/main.js" defer></script>
  <script src="{{root}}js/store.js" defer></script>
{{pageScripts}}
</body>
</html>
